<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grand Theft Auto VI Countdown</title>

<link rel="icon" href="logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
    overflow-x:hidden;
    font-family:'Montserrat',sans-serif;
    background:#000;
    color:white;
}

/* Background Slideshow */

.slideshow{
    position:fixed;
    inset:0;
    z-index:-3;
}

.slide{
    position:absolute;
    inset:0;

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    opacity:0;
    transition:opacity 2s ease;
}

.slide.active{
    opacity:1;
}

/* Purple Overlay */

.overlay{
    position:fixed;
    inset:0;

    background:
        linear-gradient(
            rgba(13,0,25,.45),
            rgba(35,0,60,.55)
        );

    z-index:-2;
}

.glow{
    position:fixed;
    inset:0;

    background:
        radial-gradient(
            circle,
            rgba(255,70,220,.15),
            transparent 65%
        );

    z-index:-1;
}

/* Layout */

.container{
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;
}

.content{
    width:100%;
    max-width:1200px;
    text-align:center;
}

/* Logo */

.logo{
    width:min(90vw,650px);
    height:auto;

    margin-bottom:25px;

    filter:
        drop-shadow(0 0 20px rgba(255,105,220,.4))
        drop-shadow(0 0 50px rgba(255,105,220,.2));
}

.subtitle{
    letter-spacing:5px;
    font-size:0.9rem;

    margin-bottom:40px;

    color:#ffffff;
}

/* Timer */

.timer{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
}

.card{
    background:rgba(0,0,0,.3);

    backdrop-filter:blur(12px);

    border:1px solid rgba(255,255,255,.1);

    border-radius:24px;

    min-width:180px;

    padding:25px;
}

.number{
    font-size:4rem;
    font-weight:800;
}

.label{
    margin-top:8px;

    color:#85f7ff;

    letter-spacing:3px;

    font-size:.8rem;
}

.release{
    margin-top:35px;

    color:#ff9be7;

    letter-spacing:4px;

    font-size:.85rem;
}

/* Music Button */

.music-btn{
    position:fixed;

    top:20px;
    right:20px;

    z-index:999;

    background:rgba(0,0,0,.4);

    backdrop-filter:blur(10px);

    border:1px solid rgba(255,255,255,.1);

    color:white;

    padding:12px 18px;

    border-radius:999px;

    cursor:pointer;

    font-weight:600;
}

.music-btn:hover{
    background:rgba(255,255,255,.1);
}

/* Mobile */

@media(max-width:768px){

    .card{
        min-width:140px;
        padding:20px;
    }

    .number{
        font-size:3rem-size:2.3rem;
    }

    .subtitle{
        font-size:.7rem;
    }

    .release{
        font-size:.7rem;
        padding:0 10px;
    }
}

</style>
</head>
<body>

<!-- Backgrounds -->

<div class="slideshow">

    <div class="slide active" style="background-image:url('images/bg1.jpg')"></div>
    <div class="slide" style="background-image:url('images/bg2.jpg')"></div>
    <div class="slide" style="background-image:url('images/bg3.jpg')"></div>
    <div class="slide" style="background-image:url('images/bg4.jpg')"></div>
    <div class="slide" style="background-image:url('images/bg5.jpg')"></div>

</div>

<div class="overlay"></div>
<div class="glow"></div>

<!-- Music -->

<audio id="bgMusic" loop>
    audio/music.mp3
</audio>

<button id="musicButton" class="music-btn">
    🔊 Music
</button>

<!-- Content -->

<div class="container">

    <div class="content">

        <img src="logo.png" alt="GTA VI Logo" class="logo">

        <div class="subtitle">
            COUNTDOWN TO RELEASE
        </div>

        <div class="timer">

            <div class="card">
                <div id="days" class="number">00</div>
                <div class="label">DAYS</div>
            </div>

            <div class="card">
                <div id="hours" class="number">00</div>
                <div class="label">HOURS</div>
            </div>

            <div class="card">
                <div id="minutes" class="number">00</div>
                <div class="label">MINUTES</div>
            </div>

            <div class="card">
                <div id="seconds" class="number">00</div>
                <div class="label">SECONDS</div>
            </div>

        </div>

        <div class="release">
            19 NOVEMBER 2026 • 12:00 AM AEDT
        </div>

    </div>

</div>

<script>

/* Countdown */

const targetDate = new Date(
    "2026-11-19T00:00:00+11:00"
).getTime();

function updateCountdown(){

    const now = Date.now();
    const diff = targetDate - now;

    if(diff <= 0){

        document.querySelector(".timer").innerHTML =
        '<h1>NOW AVAILABLE</h1>';

        return;
    }

    const days =
        Math.floor(diff / (1000*60*60*24));

    const hours =
        Math.floor((diff % (1000*60*60*24)) / (1000*60*60));

    const minutes =
        Math.floor((diff % (1000*60*60)) / (1000*60));

    const seconds =
        Math.floor((diff % (1000*60)) / 1000);

    document.getElementById("days").textContent =
        String(days).padStart(2,"0");

    document.getElementById("hours").textContent =
        String(hours).padStart(2,"0");

    document.getElementById("minutes").textContent =
        String(minutes).padStart(2,"0");

    document.getElementById("seconds").textContent =
        String(seconds).padStart(2,"0");
}

updateCountdown();
setInterval(updateCountdown,1000);

/* Slideshow */

const slides = document.querySelectorAll(".slide");
let current = 0;

setInterval(() => {

    slides[current].classList.remove("active");

    current++;

    if(current >= slides.length){
        current = 0;
    }

    slides[current].classList.add("active");

}, 8000);

/* Music */

const music = document.getElementById("bgMusic");
const musicBtn = document.getElementById("musicButton");

music.volume = 0.4;

let started = false;

document.addEventListener("click", () => {

    if(!started){

        music.play().catch(() => {});
        started = true;
    }

},{
    once:true
});

musicBtn.addEventListener("click", () => {

    music.muted = !music.muted;

    musicBtn.textContent =
        music.muted
        ? "🔇 Muted"
        : "🔊 Music";
});

</script>

</body>
</html>
