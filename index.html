<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GTA VI Countdown</title>

<link rel="icon" href="favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:'Montserrat',sans-serif;
    background:black;
}

/* SLIDESHOW */

.slideshow{
    position:fixed;
    inset:0;
    z-index:1;
}

.slide{
    position:absolute;
    inset:0;

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    opacity:0;

    transition:opacity 2s ease-in-out;
}

.slide.active{
    opacity:1;
}

/* GTA VI COLOUR OVERLAY */

.overlay{
    position:fixed;
    inset:0;

    background:
        linear-gradient(
            rgba(20,0,40,.20),
            rgba(40,0,70,.40)
        );

    z-index:2;
}

.glow{
    position:fixed;
    inset:0;

    background:
        radial-gradient(
            circle,
            rgba(255,80,220,.18),
            transparent 65%
        );

    z-index:3;
}

/* CONTENT */

.container{
    position:relative;
    z-index:10;

    width:100%;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;
}

.content{
    text-align:center;
    max-width:1200px;
    width:100%;
}

.logo{
    width:min(700px,90vw);
    max-width:100%;
    margin-bottom:25px;

    filter:
        drop-shadow(0 0 20px rgba(255,100,220,.5))
        drop-shadow(0 0 60px rgba(255,100,220,.3));
}

.subtitle{
    color:white;
    letter-spacing:4px;
    margin-bottom:35px;
    font-size:.9rem;
}

/* TIMER */

.timer{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
}

.card{
    min-width:170px;

    padding:25px;

    background:rgba(0,0,0,.25);

    backdrop-filter:blur(12px);

    border:1px solid rgba(255,255,255,.1);

    border-radius:22px;
}

.number{
    color:white;
    font-size:4rem;
    font-weight:800;
}

.label{
    margin-top:10px;

    color:#85f5ff;

    letter-spacing:3px;

    font-size:.8rem;
}

.release{
    margin-top:35px;

    color:#ffb0f0;

    letter-spacing:4px;

    font-size:.8rem;
}

/* MUSIC BUTTON */

.music-btn{
    position:fixed;

    top:20px;
    right:20px;

    z-index:100;

    border:none;

    padding:12px 18px;

    border-radius:999px;

    background:rgba(0,0,0,.4);

    color:white;

    cursor:pointer;

    backdrop-filter:blur(10px);
}

/* MOBILE */

@media(max-width:768px){

    .card{
        min-width:135px;
    }

    .number{
        font-size:3rem;
    }
}

@media(max-width:480px){

    .card{
        min-width:120px;
        padding:20px;
    }

    .number{
        font-size:2.3rem;
    }

    .subtitle{
        font-size:.75rem;
    }

}

</style>
</head>

show">

    <div class="slide active" style="background-image:url('images/bg1.jpg')"></div>
    <div class="slide" style="background-image:url('images/bg2.jpg')"></div>
    <div class="slide" style="background-image:url('images/bg3.jpg')"></div>
    <div class="slide" style="background-image:url('images/bg4.jpg')"></div>
    <div class="slide" style="background-image:url('images/bg5.jpg')"></div>

</div>

<div class="overlay"></div>
<div class="glow"></div>

<audio id="bgMusic" loop>
    audio/music.mp3
</audio>

<button id="musicButton" class="music-btn">
    ▶ Play Music
</button>

<div class="container">

    <div class="content">

        <img src="logo.png" alt="Logo" class="logo">

        <div class="subtitle">
            COUNTDOWN TO RELEASE
        </div>

        <div class="timer">

            <div class="card">
                <div id="days" class="number">00</div>
                <div class="label">DAYS</div>
            </div>

            <div class="card">
                <div id="hours" class="number">00</div>
                <div class="label">HOURS</div>
            </div>

            <div class="card">
                <div id="minutes" class="number">00</div>
                <div class="label">MINUTES</div>
            </div>

            <div class="card">
                <div id="seconds" class="number">00</div>
                <div class="label">SECONDS</div>
            </div>

        </div>

        <div class="release">
            19 NOVEMBER 2026 • 12:00 AM AEDT
        </div>

    </div>

</div>

<script>

/* COUNTDOWN */

const targetDate =
new Date("2026-11-19T00:00:00+11:00").getTime();

function updateCountdown(){

    const now = new Date().getTime();
    const diff = targetDate - now;

    if(diff <= 0){

        document.querySelector(".timer").innerHTML =
            "<h1>NOW AVAILABLE</h1>";

        return;
    }

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));

    const hours = Math.floor(
        (diff % (1000 * 60 * 60 * 24))
        / (1000 * 60 * 60)
    );

    const minutes = Math.floor(
        (diff % (1000 * 60 * 60))
        / (1000 * 60)
    );

    const seconds = Math.floor(
        (diff % (1000 * 60))
        / 1000
    );

    document.getElementById("days").textContent =
        String(days).padStart(2,"0");

    document.getElementById("hours").textContent =
        String(hours).padStart(2,"0");

    document.getElementById("minutes").textContent =
        String(minutes).padStart(2,"0");

    document.getElementById("seconds").textContent =
        String(seconds).padStart(2,"0");
}

updateCountdown();
setInterval(updateCountdown,1000);

/* SLIDESHOW */

const slides = document.querySelectorAll(".slide");

let currentSlide = 0;

setInterval(() => {

    slides[currentSlide].classList.remove("active");

    currentSlide++;

    if(currentSlide >= slides.length){
        currentSlide = 0;
    }

    slides[currentSlide].classList.add("active");

}, 8000);

/* MUSIC */

const music = document.getElementById("bgMusic");
const musicButton = document.getElementById("musicButton");

music.volume = 0.4;

musicButton.addEventListener("click", async () => {

    try{

        if(music.paused){

            await music.play();
            musicButton.textContent = "🔇 Mute";

        }else{

            music.pause();
            musicButton.textContent = "▶ Play Music";

        }

    }catch(err){

        alert("Could not play music. Check audio/music.mp3 exists.");
    }

});

</script>

</body>
</html>
