<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grand Theft Auto VI Countdown</title>

<link rel="icon" type="image/png" href="logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:'Montserrat',sans-serif;
}

/* Background slideshow */

.background{
    position:fixed;
    inset:0;
    z-index:-3;
}

.slide{
    position:absolute;
    inset:0;

    background-size:cover;
    background-position:center center;

    opacity:0;
    transition:opacity 2s ease-in-out;
}

.slide.active{
    opacity:1;
}

/* Rockstar colour grade */

.overlay{
    position:fixed;
    inset:0;
    z-index:-2;

    background:
        linear-gradient(
            rgba(15,0,35,.45),
            rgba(25,0,50,.65)
        );
}

.glow{
    position:fixed;
    inset:0;
    z-index:-1;

    background:
        radial-gradient(
            circle at center,
            rgba(255,80,220,.15),
            transparent 60%
        );
}

/* Main layout */

.container{
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;
}

.content{
    width:100%;
    max-width:1200px;

    text-align:center;
}

/* Logo */

.logo{
    width:min(650px,90vw);
    max-width:100%;

    margin-bottom:30px;

    filter:
        drop-shadow(0 0 20px rgba(255,100,220,.35))
        drop-shadow(0 0 60px rgba(255,100,220,.20));
}

/* Subtitle */

.subtitle{
    color:#ffffff;
    letter-spacing:5px;
    font-size:0.9rem;
    margin-bottom:35px;
}

/* Countdown */

.timer{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
}

.card{
    min-width:180px;

    background:rgba(0,0,0,.30);

    backdrop-filter:blur(12px);

    border:1px solid rgba(255,255,255,.10);

    border-radius:24px;

    padding:25px;
}

.number{
    font-size:4rem;
    font-weight:800;
    color:white;
}

.label{
    margin-top:10px;

    color:#7eeeff;

    font-size:0.8rem;

    letter-spacing:3px;
}

.release{
    margin-top:35px;

    color:#ff8de2;

    letter-spacing:4px;

    font-size:0.85rem;
}

/* Tablet */

@media(max-width:900px){

    .card{
        min-width:140px;
    }

    .number{
        font-size:3rem;
    }
}

/* Mobile */

@media(max-width:600px){

    .logo{
        width:85vw;
    }

    .timer{
        gap:12px;
    }

    .card{
        min-width:130px;
        padding:20px;
    }

    .number{
        font-size:2.4rem;
    }

    .subtitle{
        font-size:.75rem;
    }

    .release{
        font-size:.7rem;
        padding:0 10px;
    }
}

</style>
</head>
<body>

<div class="background">

    <div class="slide active" style="background-image:url('images/bg1.jpg')"></div>
    <div class="slide" style="background-image:url('images/bg2.jpg')"></div>
    <div class="slide" style="background-image:url('images/bg3.jpg')"></div>
    <div class="slide" style="background-image:url('images/bg4.jpg')"></div>
    <div class="slide" style="background-image:url('images/bg5.jpg')"></div>

</div>

<div class="overlay"></div>
<div class="glow"></div>

<div class="container">

    <div class="content">

        <img src="logo.png" alt="GTA VI Logo" class="logo">

        <div class="subtitle">
            COUNTDOWN TO RELEASE
        </div>

        <div class="timer">

            <div class="card">
                <div class="number" id="days">00</div>
                <div class="label">DAYS</div>
            </div>

            <div class="card">
                <div class="number" id="hours">00</div>
                <div class="label">HOURS</div>
            </div>

            <div class="card">
                <div class="number" id="minutes">00</div>
                <div class="label">MINUTES</div>
            </div>

            <div class="card">
                <div class="number" id="seconds">00</div>
                <div class="label">SECONDS</div>
            </div>

        </div>

        <div class="release">
            19 NOVEMBER 2026 • 12:00 AM AEDT
        </div>

    </div>

</div>

<script>

/* Countdown */

const targetDate =
new Date("2026-11-19T00:00:00+11:00").getTime();

function updateCountdown(){

    const now = Date.now();

    const diff = targetDate - now;

    if(diff <= 0){

        document.querySelector(".timer").innerHTML =
        "<h1 style='color:white;'>NOW AVAILABLE</h1>";

        return;
    }

    const days =
    Math.floor(diff / (1000 * 60 * 60 * 24));

    const hours =
    Math.floor(
        (diff % (1000 * 60 * 60 * 24))
        / (1000 * 60 * 60)
    );

    const minutes =
    Math.floor(
        (diff % (1000 * 60 * 60))
        / (1000 * 60)
    );

    const seconds =
    Math.floor(
        (diff % (1000 * 60))
        / 1000
    );

    document.getElementById("days").textContent =
    String(days).padStart(2,"0");

    document.getElementById("hours").textContent =
    String(hours).padStart(2,"0");

    document.getElementById("minutes").textContent =
    String(minutes).padStart(2,"0");

    document.getElementById("seconds").textContent =
    String(seconds).padStart(2,"0");
}

updateCountdown();
setInterval(updateCountdown,1000);

/* Background slideshow */

const slides =
document.querySelectorAll(".slide");

let currentSlide = 0;

setInterval(() => {

    slides[currentSlide].classList.remove("active");

    currentSlide++;

    if(currentSlide >= slides.length){
        currentSlide = 0;
    }

    slides[currentSlide].classList.add("active");

}, 8000);

</script>

</body>
</html>
