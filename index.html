<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GTA VI Countdown</title>

<link rel="icon" type="image/png" href="logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Montserrat',sans-serif;
    overflow:hidden;
    background:#000;
    color:white;
}

/* Background Slideshow */

.slideshow{
    position:fixed;
    inset:0;
    z-index:-3;
}

.slide{
    position:absolute;
    inset:0;

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    opacity:0;

    transition:opacity 2s ease-in-out;

    filter:saturate(1.2);
}

.slide.active{
    opacity:1;
}

/* Overlay */

.overlay{
    position:fixed;
    inset:0;
    z-index:-2;

    background:
    linear-gradient(
        rgba(20,0,40,.25),
        rgba(35,0,60,.40)
    );
}

.glow{
    position:fixed;
    inset:0;

    z-index:-1;

    background:
    radial-gradient(
        circle,
        rgba(255,80,220,.15),
        transparent 65%
    );
}

/* Main Layout */

.container{
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;
}

.content{
    width:100%;
    max-width:1200px;
    text-align:center;
}

/* Logo */

.logo{
    width:min(750px,90vw);
    max-width:100%;
    margin-bottom:25px;

    filter:
        drop-shadow(0 0 20px rgba(255,100,220,.4))
        drop-shadow(0 0 60px rgba(255,100,220,.2));
}

/* Text */

.subtitle{
    letter-spacing:5px;
    margin-bottom:40px;
    font-size:.9rem;
}

/* Countdown */

.timer{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.card{

    min-width:180px;

    padding:25px;

    border-radius:24px;

    background:rgba(0,0,0,.30);

    backdrop-filter:blur(15px);

    border:1px solid rgba(255,255,255,.08);
}

.number{
    font-size:4rem;
    font-weight:800;
}

.label{
    margin-top:10px;

    color:#7eeeff;

    font-size:.8rem;

    letter-spacing:3px;
}

.release{
    margin-top:35px;

    color:#ff98e7;

    letter-spacing:4px;

    font-size:.85rem;
}

/* Music Button */

.music-btn{

    position:fixed;

    top:20px;
    right:20px;

    padding:12px 18px;

    border:none;

    border-radius:999px;

    background:rgba(0,0,0,.45);

    backdrop-filter:blur(10px);

    color:white;

    cursor:pointer;

    z-index:9999;
}

.music-btn:hover{
    background:rgba(255,255,255,.10);
}

/* Mobile */

@media(max-width:768px){

    .card{
        min-width:140px;
    }

    .number{
        font-size:3rem;
    }

}

@media(max-width:500px){

    .card{
        min-width:120px;
        padding:20px;
    }

    .number{
        font-size:2.4rem;
    }

    .subtitle{
        font-size:.75rem;
    }

}

</style>
</head>
<body>

<!-- Slideshow -->

<div class="slideshow">

    <div class="slide active" style="background-image:url('images/bg1.jpg')"></div>
    <div class="slide" style="background-image:url('images/bg2.jpg')"></div>
    <div class="slide" style="background-image:url('images/bg3.jpg')"></div>
    <div class="slide" style="background-image:url('images/bg4.jpg')"></div>
    <div class="slide" style="background-image:url('images/bg5.jpg')"></div>

</div>

<div class="overlay"></div>
<div class="glow"></div>

<!-- Audio -->

<audio id="bgMusic" loop>
    <source src="audio/music.mp3" type="audio/mpeg">
</audio>

<button id="musicButton" class="music-btn">
    ▶ Play Music
</button>

<!-- Content -->

<div class="container">

    <div class="content">

        <img src="logo.png" class="logo" alt="GTA VI Logo">

        <div class="subtitle">
            COUNTDOWN TO RELEASE
        </div>

        <div class="timer">

            <div class="card">
                <div class="number" id="days">00</div>
                <div class="label">DAYS</div>
            </div>

            <div class="card">
                <div class="number" id="hours">00</div>
                <div class="label">HOURS</div>
            </div>

            <div class="card">
                <div class="number" id="minutes">00</div>
                <div class="label">MINUTES</div>
            </div>

            <div class="card">
                <div class="number" id="seconds">00</div>
                <div class="label">SECONDS</div>
            </div>

        </div>

        <div class="release">
            19 NOVEMBER 2026 • 12:00 AM AEDT
        </div>

    </div>

</div>

<script>

/* Countdown */

const targetDate =
new Date("2026-11-19T00:00:00+11:00").getTime();

    const diff = targetDate - now;

    String(hours).padStart(2,"0");

const slides =
document.querySelectorAll(".slide");

let current = 0;

setInterval(() => {

    slides[current].classList.remove("active");

    current++;

    if(current >= slides.length){
        current = 0;
    }

    slides[current].classList.add("active");

}, 8000);

/* Audio */

const music =
document.getElementById("bgMusic");

const button =
document.getElementById("musicButton");

music.volume = 0.4;

button.addEventListener("click", async () => {

    try{

        if(music.paused){

            await music.play();
            button.textContent = "🔇 Mute Music";

        }else{

            music.pause();
            button.textContent = "▶ Play Music";

        }

    }catch(error){

        alert("Unable to play audio. Check that audio/music.mp3 exists.");
    }

});

</script>

</body>
</html>
