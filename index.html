<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grand Theft Auto VI Countdown</title>

<link rel="icon" type="image/png" href="logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Montserrat',sans-serif;
    overflow:hidden;
    background:black;
    color:white;
}

/* BACKGROUND SLIDES */

.slide{
    position:fixed;
    inset:0;

    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat;

    opacity:0;
    transition:opacity 2.5s ease;

    transform:scale(1.05);
}

.slide.active{
    opacity:1;
}

/* ROCKSTAR OVERLAY */

.overlay{
    position:fixed;
    inset:0;

    background:
    linear-gradient(
        to bottom,
        rgba(8,0,20,.45),
        rgba(20,0,45,.65),
        rgba(10,0,25,.85)
    );

    z-index:3;
}

.overlay::before{
    content:"";

    position:absolute;
    inset:0;

    background:
    radial-gradient(
        circle at center,
        rgba(255,106,214,.12),
        transparent 65%
    );
}

/* MAIN CONTENT */

.container{
    position:relative;
    z-index:10;

    width:100%;
    height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:20px;
}

.content{
    width:100%;
    max-width:1400px;
}

/* LOGO */

.logo{
    width:min(850px,90vw);

    margin-bottom:30px;

    filter:
    drop-shadow(0 0 20px rgba(255,80,220,.35))
    drop-shadow(0 0 60px rgba(255,80,220,.15));
}

/* TEXT */

.subtitle{
    color:#c8f8ff;

    letter-spacing:6px;

    font-size:.9rem;

    text-transform:uppercase;

    margin-bottom:40px;
}

.release{
    margin-top:40px;

    color:#ff9de9;

    letter-spacing:4px;

    text-transform:uppercase;

    font-size:.85rem;
}

/* COUNTDOWN */

.timer{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.card{

    width:200px;

    background:
    rgba(20,20,30,.35);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.08);

    border-radius:24px;

    padding:30px;

    box-shadow:
    0 15px 40px rgba(0,0,0,.35);
}

.number{
    font-size:4.8rem;
    font-weight:800;
    line-height:1;
}

.label{
    margin-top:10px;

    color:#89f1ff;

    letter-spacing:2px;

    font-size:.8rem;
}

/* MOBILE */

@media(max-width:900px){

    .card{
        width:150px;
        padding:25px;
    }

    .number{
        font-size:3rem;
    }

}

@media(max-width:600px){

    .card{
        width:130px;
    }

    .number{
        font-size:2.5rem;
    }

    .subtitle{
        font-size:.75rem;
    }

}

</style>
</head>
<body>

<!-- Slideshow -->

<div class="slide active" style="background-image:url('images/bg1.jpg');"></div>
<div class="slide" style="background-image:url('images/bg2.jpg');"></div>
<div class="slide" style="background-image:url('images/bg3.jpg');"></div>
<div class="slide" style="background-image:url('images/bg4.jpg');"></div>
<div class="slide" style="background-image:url('images/bg5.jpg');"></div>

<div class="overlay"></div>

<!-- Main Content -->

<div class="container">

    <div class="content">

        <img src="logo.png" alt="GTA VI Logo" class="logo">

        <div class="subtitle">
            COUNTDOWN TO RELEASE
        </div>

        <div class="timer">

            <div class="card">
                <div class="number" id="days">00</div>
                <div class="label">DAYS</div>
            </div>

            <div class="card">
                <div class="number" id="hours">00</div>
                <div class="label">HOURS</div>
            </div>

            <div class="card">
                <div class="number" id="minutes">00</div>
                <div class="label">MINUTES</div>
            </div>

            <div class="card">
                <div class="number" id="seconds">00</div>
                <div class="label">SECONDS</div>
            </div>

        </div>

        <div class="release">
            19 NOVEMBER 2026 • 12:00 AM AEST
        </div>

    </div>

</div>

<script>

</body>
</html>
