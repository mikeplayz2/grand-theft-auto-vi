<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grand Theft Auto VI Countdown</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family:'Montserrat',sans-serif;
    background:#000;
    color:white;
}

/* BACKGROUND SLIDESHOW */

.bg{
    position:fixed;
    inset:0;
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    opacity:0;
    transition:opacity 2s ease;

    transform:scale(1.05);
}

.bg.active{
    opacity:1;
}

.bg::after{
    content:"";
    position:absolute;
    inset:0;

    background:
    linear-gradient(
        rgba(20,0,40,.65),
        rgba(20,0,40,.80)
    );

    backdrop-filter:blur(2px);
}

/* GTA VI COLOUR GRADE */

.purple-glow{
    position:fixed;
    inset:0;

    background:
    radial-gradient(
        circle at center,
        rgba(255,80,220,.20),
        transparent 60%
    );

    z-index:5;
    pointer-events:none;
}

/* MAIN CONTENT */

.container{
    position:relative;
    z-index:20;

    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
}

.content{
    text-align:center;
    padding:30px;
    width:100%;
    max-width:1400px;
}

/* TITLE */

.pretitle{
    text-transform:uppercase;
    letter-spacing:8px;

    color:#ff9eea;

    font-size:.8rem;

    margin-bottom:20px;
}

.title{

    font-size:clamp(4rem,10vw,9rem);

    font-weight:800;

    line-height:.9;

    background:
    linear-gradient(
        180deg,
        #ffffff,
        #ff80dd
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    text-shadow:
        0 0 30px rgba(255,95,220,.4);

    margin-bottom:12px;
}

.subtitle{

    color:#85f6ff;

    letter-spacing:4px;

    margin-bottom:60px;

    text-transform:uppercase;
}

/* COUNTDOWN */

.timer{
    display:flex;
    justify-content:center;
    gap:25px;
    flex-wrap:wrap;
}

.card{

    min-width:190px;

    padding:35px;

    border-radius:22px;

    background:
        rgba(15,15,25,.35);

    backdrop-filter:blur(16px);

    border:
        1px solid rgba(255,255,255,.15);

    box-shadow:
        0 10px 40px rgba(0,0,0,.5),
        0 0 30px rgba(255,95,220,.15);
}

.number{

    font-size:4.8rem;

    font-weight:800;

    line-height:1;
}

.label{

    margin-top:10px;

    color:#85f6ff;

    font-size:.8rem;

    letter-spacing:3px;
}

/* FOOTER */

.release{
    margin-top:50px;

    color:#ff9eea;

    letter-spacing:3px;

    text-transform:uppercase;

    opacity:.9;
}

@media(max-width:768px){

    .card{
        min-width:140px;
        padding:25px;
    }

    .number{
        font-size:3rem;
    }

    .title{
        font-size:4rem;
    }

}

</style>
</head>
<body>

<!-- BACKGROUNDS -->

<div class="bg active" style="background-image:url('images/bg1.jpg')"></div>
<div class="bg" style="background-image:url('images/bg2.jpg')"></div>
<div class="bg" style="background-image:url('images/bg3.jpg')"></div>
<div classimages/bg5.jpg')"></div>

<div class="purple-glow"></div>

<div class="container">

    <div class="content">

        <div class="pretitle">
            Rockstar Games
        </div>

        <div class="title">
            GTA VI
        </div>

        <div class="subtitle">
            Countdown To Vice City
        </div>

        <div class="timer">

            <div class="card">
                <div id="days" class="number">00</div>
                <div class="label">DAYS</div>
            </div>

            <div class="card">
                <div id="hours" class="number">00</div>
                <div class="label">HOURS</div>
            </div>

            <div class="card">
                <div id="minutes" class="number">00</div>
                <div class="label">MINUTES</div>
            </div>

            <div class="card">
                <div id="seconds" class="number">00</div>
                <div class="label">SECONDS</div>
            </div>

        </div>

        <div class="release">
            19 November • 12:00 AM AEST
        </div>

    </div>

</div>

<script>

/* COUNTDOWN */

const targetDate =
new Date("2026-11-19T00:00:00+10:00").getTime();

function updateCountdown(){

    const now = new Date().getTime();
    const distance = targetDate - now;

    if(distance <= 0){
        document.querySelector(".timer").innerHTML =
        "<h1>RELEASED</h1>";
        return;
    }

    const days =
    Math.floor(distance/(1000*60*60*24));

    const hours =
    Math.floor(
        (distance%(1000*60*60*24))
        /(1000*60*60)
    );

    const minutes =
    Math.floor(
        (distance%(1000*60*60))
        /(1000*60)
    );

    const seconds =
    Math.floor(
        (distance%(1000*60))
        /1000
    );

    document.getElementById("days").innerText =
    String(days).padStart(2,"0");

    document.getElementById("hours").innerText =
    String(hours).padStart(2,"0");

    document.getElementById("minutes").innerText =
    String(minutes).padStart(2,"0");

    document.getElementById("seconds").innerText =
    String(seconds).padStart(2,"0");
}

updateCountdown();
setInterval(updateCountdown,1000);

/* SLIDESHOW */

const slides =
document.querySelectorAll(".bg");

let current = 0;

setInterval(() => {

    slides[current].classList.remove("active");

    current++;

    if(current >= slides.length){
        current = 0;
    }

    slides[current].classList.add("active");

}, 8000);

</script>

</body>
</html>
